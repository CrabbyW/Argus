<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8"><title>Argus — finální značka</title>
<style>
 body{margin:0;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;background:#FAF9F8;color:#242424}
 header{background:#fff;border-bottom:1px solid #E0E0E0;padding:40px}
 h1{margin:0;font-size:24px;font-weight:600}
 h2{font-size:14px;font-weight:600;color:#616161;text-transform:uppercase;letter-spacing:.08em;margin:0 0 16px}
 section{padding:32px 40px;border-bottom:1px solid #E0E0E0}
 .row{display:flex;align-items:center;gap:40px;flex-wrap:wrap}
 .dark{background:#0C3B5E;padding:24px 32px;border-radius:8px}
 .chip{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;color:#616161}
 .appbar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #E0E0E0;
   border-radius:8px;padding:12px 16px;width:420px;font-weight:600;color:#0C3B5E}
 .appbar span{margin-left:auto;font-weight:400;font-size:12px;color:#616161}
 code{background:#F0F0F0;padding:2px 6px;border-radius:4px;font-size:12px}
</style></head><body>
<header><h1>Argus — finální značka</h1></header>

<section><h2>Plné logo</h2><div class="row">
  <img src="argus-logo.svg" width="260" alt="">
  <div class="dark"><img src="argus-logo-dark.svg" width="260" alt=""></div>
</div></section>

<section><h2>Značka</h2><div class="row">
  <div class="chip"><img src="argus-mark.svg" width="64" alt=""><b>barevná 64</b></div>
  <div class="chip"><img src="argus-mark.svg" width="32" alt=""><b>32</b></div>
  <div class="chip"><img src="argus-mark-mono.svg" width="48" alt="" style="color:#242424"><b>mono</b></div>
  <div class="chip"><img src="argus-app-icon.svg" width="72" alt=""><b>app icon</b></div>
</div></section>

<section><h2>Favikona v kontextu</h2><div class="row">
  <div class="chip"><img src="favicon.svg" width="16" alt=""><b>16</b></div>
  <div class="chip"><img src="favicon.svg" width="32" alt=""><b>32</b></div>
  <div class="chip"><img src="favicon.svg" width="48" alt=""><b>48</b></div>
  <div class="appbar"><img src="favicon.svg" width="20" alt="">Argus<span>Installations</span></div>
</div></section>

<section><h2>Paleta</h2><div class="row">
  <code>#0F6CBD</code><code>#479EF5</code><code>#0C3B5E</code><code>#242424</code><code>#616161</code>
</div></section>
</body></html>
